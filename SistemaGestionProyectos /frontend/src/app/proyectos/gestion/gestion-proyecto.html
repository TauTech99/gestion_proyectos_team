<p-dialog [header]="header()" [modal]="true" [(visible)]="visible" [style]="{ width: '32rem' }"
    (onHide)="cerrarDialog()">
    <form [formGroup]="form">
        <div id="contenedor-formulario">
            <label for="nombre" class="form-label">Nombre del proyecto *</label>
            <input pInputText type="text" id="nombre" placeholder="Ej: Sistema de facturación" formControlName="nombre" />

            <label class="form-label">
                Cliente (opcional)
                @if (clienteDeshabilitado()) {
                    <span class="label-hint"> — solo disponible cuando el proyecto está Activo</span>
                }
            </label>
            <p-select
                formControlName="idCliente"
                [options]="clientesActivos()"
                optionLabel="nombre"
                optionValue="id"
                placeholder="Sin cliente (proyecto interno)"
                appendTo="body"
                [showClear]="true"
                [disabled]="clienteDeshabilitado()"
                [style]="{ width: '100%' }"
            />

            @if (proyectoSeleccionado()) {
                <label class="form-label">Estado</label>
                <p-select formControlName="estado" [options]="estadosProyecto()" placeholder="Estado" appendTo="body" [style]="{ width: '100%' }" />
            }
        </div>
    </form>
    <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 0.5rem;">
        <p-button label="Cancelar" severity="secondary" (click)="cerrarDialog()"></p-button>
        <p-button label="Guardar" icon="pi pi-check" (click)="guardarProyecto()"></p-button>
    </div>
</p-dialog>
