<app-template>
    <div id="acciones">
        <p-button icon="pi pi-plus" label="Crear Proyecto" (click)="crearProyecto()"></p-button>
        <p-button icon="pi pi-users" label="Gestionar Clientes" severity="secondary" (click)="abrirClientes()"></p-button>
    </div>
    <p-table id="tabla" [value]="proyectos()" [tableStyle]="{ 'min-width': '50rem' }" [scrollable]="true" scrollHeight="70vh">
        <ng-template #header>
            <tr>
                <th>Nombre</th>
                <th>Cliente</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template #body let-proyecto>
            <tr>
                <td><strong>{{ proyecto.nombre }}</strong></td>
                <td>{{ proyecto.cliente ? proyecto.cliente.nombre : '—' }}</td>
                <td>
                    <span class="badge badge-{{ proyecto.estado | lowercase }}">{{ proyecto.estado }}</span>
                </td>
                <td class="acciones-col">
                    <p-button icon="pi pi-list" pTooltip="Ver Tareas" tooltipPosition="top" severity="info" size="small" (click)="gestionarTareas(proyecto)"></p-button>
                    <p-button icon="pi pi-pencil" pTooltip="Editar Proyecto" tooltipPosition="top" severity="secondary" size="small" (click)="editarProyecto(proyecto)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="4" style="text-align:center; color:#999; padding: 2rem;">No se encontraron proyectos.</td>
            </tr>
        </ng-template>
    </p-table>
</app-template>

<app-gestion-proyecto [(visible)]="dialogVisible" [(proyectoSeleccionado)]="proyectoSeleccionado"></app-gestion-proyecto>
<app-clientes-listado [(visible)]="dialogClientesVisible"></app-clientes-listado>
