<p-dialog [header]="header()" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }"
    (onHide)="cerrarDialog()">

    <form [formGroup]="form">
        <div id="contenedor-formulario">

            <input pInputText type="text" id="nombre" placeholder="Nombre" formControlName="nombre" />

            <input pInputText type="text" id="telefono" placeholder="Teléfono (opcional)" formControlName="telefono" />

            <input pInputText type="email" id="email" placeholder="Email (opcional)" formControlName="email" />

            @if (form.controls['email'].touched && form.controls['email'].errors?.['email']) {
            <small class="email-error">Ingrese un email válido.</small>
            }

            @if (clienteSeleccionado()) {
            <p-select id="estado" formControlName="estado" [options]="estados()" placeholder="Estado" appendTo="body" />
            }

        </div>
    </form>

    <button pButton label="Guardar" (click)="guardarCliente()"></button>

</p-dialog>
