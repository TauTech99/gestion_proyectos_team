<div class="min-h-screen bg-slate-50 dark:bg-[#0b1120] font-sans transition-colors duration-300">

    <header
        class="bg-white dark:bg-[#111827] border-b border-slate-200 dark:border-slate-800 px-7 h-14 flex items-center justify-between transition-colors duration-300">
        <div class="flex items-center gap-2.5">
            <span class="w-2.5 h-2.5 rounded-full bg-green-500 flex-shrink-0"></span>
            <h1 id="nombre-de-proyecto"
                class="font-display text-[17px] font-extrabold tracking-tight text-slate-900 dark:text-slate-100">
                Sistema de Gestión de Proyectos
            </h1>
        </div>
        <div class="flex items-center gap-2.5">
            <p-button id="boton-cerrar-sesion" icon="pi pi-sign-out" label="Cerrar Sesión" [text]="true"
                severity="secondary" (click)="logout()"
                styleClass="!text-slate-500 dark:!text-slate-400 !border !border-slate-200 dark:!border-slate-700 hover:!border-green-500 hover:!text-green-600 !rounded-lg !text-[13px] !font-medium !px-3.5 !py-1.5 transition-all" />
        </div>
    </header>

    <div id="content" class="px-7 pt-7 pb-5">
        <ng-content></ng-content>
    </div>

</div>
